steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - services/clamav-worker/Dockerfile
      - --tag
      - ${_IMAGE}
      - .
  - name: gcr.io/cloud-builders/docker
    args: [push, ${_IMAGE}]

images:
  - ${_IMAGE}

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
