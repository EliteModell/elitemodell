apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: elitemodell-clamav-candidate
  labels:
    environment: candidate
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 1
      timeoutSeconds: 600
      serviceAccountName: REPLACE_WITH_LEAST_PRIVILEGE_SERVICE_ACCOUNT
      containers:
        - image: REPLACE_WITH_IMMUTABLE_ARTIFACT_REGISTRY_DIGEST
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 48
          env:
            - name: REQUIRE_CLOUD_TASK_HEADER
              value: "true"
            - name: CLAMAV_SIGNATURE_MAX_AGE_HOURS
              value: "48"
            - name: SCANNER_MAX_FILE_BYTES
              value: "262144000"
            - name: SCANNER_TIMEOUT_MS
              value: "300000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: REPLACE_DATABASE_URL_SECRET
                  key: latest
            - name: NEXT_PUBLIC_SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: REPLACE_SUPABASE_URL_SECRET
                  key: latest
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: REPLACE_SUPABASE_SERVICE_ROLE_KEY_SECRET
                  key: latest
